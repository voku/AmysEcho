name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            server/package-lock.json
            integration/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Cache pip downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('server/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Run full check
        run: NODE_OPTIONS=--max_old_space_size=4096 ./scripts/full-check.sh
      - name: Security audit (webapp)
        run: npm audit --prefix webapp --audit-level=high
      - name: Security audit (server)
        run: npm audit --prefix server --audit-level=high
      - name: Security audit (integration)
        run: npm audit --prefix integration --audit-level=high
