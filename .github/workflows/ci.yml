name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            server/package-lock.json
            integration/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Cache pip downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('server/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Run full check
        run: NODE_OPTIONS=--max_old_space_size=4096 ./scripts/full-check.sh

      - name: Coverage gate (webapp)
        run: npm --prefix webapp run test:coverage -- --coverage.reporter=text-summary

      - name: Security audit (webapp)
        run: npm audit --prefix webapp --audit-level=high
      - name: Security audit (server)
        run: npm audit --prefix server --audit-level=high
      - name: Security audit (integration)
        run: npm audit --prefix integration --audit-level=high


  server-training-readiness-gate:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            training_related:
              - '.github/workflows/ci.yml'
              - 'server/test/test_training_pipeline_fixture.py'
              - 'server/test/fixtures/training_integration_fixture.json'
              - 'server/src/routes/latestMlpModelRoute.ts'
              - 'server/src/**/training*.ts'
              - 'server/src/**/*training*.ts'
              - 'server/src/**/*manifest*.ts'
              - 'server/src/routes/diagnosticsRoutes.ts'
              - 'server/src/routes/training*.ts'
              - 'server/src/services/training*.ts'
              - 'server/src/services/*manifest*.ts'
              - 'server/src/services/mlpModelArtifacts.ts'
              - 'server/src/server.ts'
              - 'server/src/amyserver_tools/train_mlp.py'
              - 'server/src/amyserver_tools/train_mlp_fewshot.py'
      - uses: actions/setup-node@v6
        if: steps.changes.outputs.training_related == 'true'
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v6
        if: steps.changes.outputs.training_related == 'true'
        with:
          python-version: '3.14'
      - name: Install server dependencies
        if: steps.changes.outputs.training_related == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          npm ci --prefix server
      - name: Run required training integration fixture test
        if: steps.changes.outputs.training_related == 'true'
        run: pytest server/test/test_training_pipeline_fixture.py -q
      - name: Skip when unrelated files changed
        if: steps.changes.outputs.training_related != 'true'
        run: echo "No training/manifest/readiness/promotion server changes detected; gate test skipped."
