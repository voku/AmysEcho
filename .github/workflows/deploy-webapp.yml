# GitHub Pages Deployment Workflow for Amy's Echo Webapp
# Deploys the webapp to https://voku.github.io/AmysEcho/

name: Deploy Webapp to GitHub Pages

on:
  # Deploy on push to main branch
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/deploy-webapp.yml'
  
  # Allow manual deployment
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /AmysEcho/
      # Tests intentionally run without a deployment API override.
      # VITE_API_URL is provided only to the production build below.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: webapp
      
      - name: Type check
        run: npm run type-check
        working-directory: webapp
      
      - name: Run tests
        run: npm test
        working-directory: webapp
      
      - name: Build
        run: npm run build
        working-directory: webapp
        env:
          # This value is a public client-side build setting, not a server secret.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://amysecho.moelleken.org' }}
      
      - name: Setup Pages
        uses: actions/configure-pages@v6
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
