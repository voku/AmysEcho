name: TEMP server npm audit lockfile repair
on:
  push:
    branches:
      - fix/webapp-npm-audit-20261107
    paths:
      - '.github/workflows/server-lock-repair-candidate.yml'
      - 'server/package.json'

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
      - name: Patch compatible server lockfile dependencies only
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit fix --prefix server --package-lock-only --ignore-scripts --no-fund
          audit_exit=$?
          set -e
          echo "npm audit fix exit: $audit_exit (nonzero can mean major updates remain)"
          echo "::group::Remaining server audit"
          npm audit --prefix server --audit-level=high || true
          echo "::endgroup::"
          echo "::group::Staged changes"
          git diff --stat
          echo "::endgroup::"
          git add -- server/package-lock.json server/package.json
          if git diff --cached --quiet; then
            echo "No compatible server updates found"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(security): update compatible server npm lock resolutions'
          git push origin HEAD:fix/webapp-npm-audit-20261107
