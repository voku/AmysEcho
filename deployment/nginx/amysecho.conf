# Amy's Echo - nginx Reverse Proxy Configuration
# 
# Installation:
# 1. Copy this file to /etc/nginx/sites-available/amysecho
# 2. Update 'your-domain.com' with your actual domain
# 3. Update SSL certificate paths
# 4. Enable: sudo ln -s /etc/nginx/sites-available/amysecho /etc/nginx/sites-enabled/
# 5. Test: sudo nginx -t
# 6. Reload: sudo systemctl reload nginx

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # SSL certificates
    # Update these paths after running certbot
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client body size (for video uploads)
    client_max_body_size 100M;

    # CORS headers for the public webapp (adjust the allowed origins as needed)
    set $amysecho_cors_origin "";
    if ($http_origin = "https://voku.github.io") {
        set $amysecho_cors_origin $http_origin;
    }

    # Proxy to Node.js server
    location / {
        add_header 'Access-Control-Allow-Origin' $amysecho_cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-profile-id' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://localhost:5000/health;
        access_log off;
    }

    # Logging
    access_log /var/log/nginx/amysecho-access.log;
    error_log /var/log/nginx/amysecho-error.log;
}
