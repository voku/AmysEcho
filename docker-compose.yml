version: '3.8'

services:
  amysecho-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: amysecho-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_TOKEN=${API_TOKEN:-demo-token}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production}
      - BACKUP_SECRET=${BACKUP_SECRET:-default-secret-password}
      - API_LIMIT=${API_LIMIT:-120}
    volumes:
      # Persist data, models, and database
      - ./server/data:/app/data
      - ./server/db.json:/app/db.json
      # Optionally mount logs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
