[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "venv",
    ".venv",
    "node_modules",
    "docs/training/external",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long
    "E701",   # multiple statements on one line (colon)
    "B007",   # unused loop control variable
    "W291",   # trailing whitespace
    "W293",   # blank line contains whitespace
    "B905",   # zip() without strict
    "RUF003", # ambiguous unicode character (intentional in comments)
]

[tool.ruff.lint.isort]
known-first-party = ["amyserver_tools", "ml_shared_utils"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
no_implicit_optional = true
strict_equality = true
# Configure mypy to handle scripts as importable modules for server code
# Note: Run mypy separately on server/ and scripts/ to avoid "source file found twice" error
# while maintaining full type coverage (scripts/ is imported by server via sys.path manipulation)
mypy_path = "scripts"
namespace_packages = true
explicit_package_bases = true
disable_error_code = ["attr-defined", "arg-type", "var-annotated", "union-attr", "operator", "assignment", "index", "return-value", "no-any-return", "import-untyped"]
exclude = [
    "venv",
    ".venv",
    "node_modules",
]


