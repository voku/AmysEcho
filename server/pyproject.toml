[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amyserver-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []
description = "Training and preprocessing tools for Amy's Echo server"
license = { text = "MIT" }
authors = [{ name = "Amy's Echo Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = { find = { where = ["src"], include = ["amyserver_tools*"] } }

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore:'aifc' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread.rawread",
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread.rawread",
    "ignore:'sunau' is deprecated and slated for removal in Python 3.13:DeprecationWarning:audioread.rawread",
    "ignore:.*aifc was removed in Python 3.13.*:DeprecationWarning:audioread.rawread",
    "ignore:.*sunau was removed in Python 3.13.*:DeprecationWarning:audioread.rawread",
    "ignore:PySoundFile failed\\. Trying audioread instead\\.:UserWarning:amyserver_tools.audio_preprocessing",
    "ignore:librosa\\.core\\.audio\\.__audioread_load.*:FutureWarning:librosa.core.audio",
]
