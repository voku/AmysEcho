    <!-- GitHub Pages SPA redirect handler -->
    <script type="text/javascript">
      // Handle redirect from 404.html and preserve query parameters correctly
      (function handleSpaRedirect(l) {
        if (l.search.startsWith('?/')) {
          const redirectSegments = l.search
            .slice(2) // drop leading "?/"
            .split('&')
            .map((segment) => segment.replace(/~and~/g, '&'));

          const redirectPath = redirectSegments[0] || '';
          const query = redirectSegments.slice(1);
          const search = query.length > 0 ? `?${query.join('&')}` : '';

          const url = new URL(redirectPath, l.href);
          url.search = search;
          const newUrl = url.pathname + url.search + l.hash;

          window.history.replaceState(null, null, newUrl);
        }
      })(window.location);
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
