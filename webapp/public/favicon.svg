<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05363A"/>
      <stop offset="100%" style="stop-color:#0F5257"/>
    </linearGradient>
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF1DD"/>
      <stop offset="100%" style="stop-color:#FF8A5B"/>
    </linearGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)" stroke="#FF8A5B" stroke-width="2"/>
  
  <!-- Stylized hand/wave symbol -->
  <g transform="translate(20, 25)">
    <!-- Palm -->
    <ellipse cx="30" cy="35" rx="18" ry="20" fill="url(#handGradient)"/>
    
    <!-- Fingers -->
    <rect x="12" y="8" width="7" height="22" rx="3.5" fill="url(#handGradient)" transform="rotate(-10, 15, 20)"/>
    <rect x="22" y="3" width="7" height="26" rx="3.5" fill="url(#handGradient)"/>
    <rect x="32" y="3" width="7" height="26" rx="3.5" fill="url(#handGradient)"/>
    <rect x="42" y="8" width="7" height="22" rx="3.5" fill="url(#handGradient)" transform="rotate(10, 45, 20)"/>
    
    <!-- Thumb -->
    <ellipse cx="10" cy="35" rx="6" ry="10" fill="url(#handGradient)" transform="rotate(-30, 10, 35)"/>
  </g>
  
  <!-- Small echo waves -->
  <path d="M 75 40 Q 85 50 75 60" stroke="#FF8A5B" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 80 35 Q 93 50 80 65" stroke="#FF8A5B" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
